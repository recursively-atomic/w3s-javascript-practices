<body>
    <header>
        <h2> Event Listener Exercise </h2>

        <nav>
            <li><a href="../1_counter/index.html"> Exercise 1 </a></li>
            <li><a class="active"> Exercise 2 </a></li>
            <li><a> Exercise 3 </a></li>
            <li><a> Exercise 4 </a></li>
            <li><a> Exercise 5 </a></li>
            <span></span>
        </nav>
    </header>

    <main>
        <div id="displays">
            <h2 id="count"> <!-- insert count here --> </h2>
            
            <div id="messages">
                <template class="message"> <!-- insert message here --> </template>
            </div>
        </div>

        <div id="buttons">
            <button id="increase">
                <h2> + </h2>
                <span class="tooltip"> Adds 1 to the count. </span>
            </button>

            <button id="decrease">
                <h2> - </h2>
                <span class="tooltip"> Subtracts 1 to the count. </span>
            </button>

            <button id="reset">
                <h2> Reset </h2>
                <span class="tooltip"> Resets the count to 0. </span>
            </button>

            <button id="save">
                <h2> Save </h2>
                <span class="tooltip"> Saves the count to be loaded later. </span>
            </button>

            <button id="load">
                <h2> Load </h2>
                <span class="tooltip"> Loads the saved count. </span>
            </button>

            <button id="clear">
                <h2> Clear </h2>
                <span class="tooltip"> Clears the loaded count. </span>
            </button>
        </div>
    </main>

    <footer>
        <h2> Renier Anthony V. Namol &copy; 2026 </h2>
    </footer>
